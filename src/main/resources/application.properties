spring.application.name=rental-api

# Base Path
spring.web.path-pattern=/api
rentalapi.upload.dir=${UPLOAD_DIR}

# Server Configuration
server.port=${SERVER_PORT}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Jwt Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform

# Enable ANSI colors in console output
spring.output.ansi.enabled=ALWAYS

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.ocp3=DEBUG
logging.file.name=logs/rental-api.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %highlight(%-5level) - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %-5level - %msg%n
